# The ThinkPad's built-in keyboard, which has UK legends.
#
# This file exists because the desktop is set to a plain `us` layout: keyd's
# key table is US-positional, so anything else underneath it corrupts both the
# ordinary keys and the base36 sequences keyd uses for characters the layout
# does not contain. So `us` underneath, and every real layout lives here.
[ids]
0001:0001:70533846

include layouts/gb

[global]
default_layout = gb
