# The Logitech G510, which has German legends.
#
# The id has three fields on purpose. keyd matches ids by PREFIX, so the
# two-field form 046d:c22d would also match this keyboard's other evdev nodes
# - in particular "Logitech Gaming Keyboard Gaming Keys" (046d:c22d:ac1dab43),
# which is the node hid-lg-g15 creates for G1-G18, the M keys and the keys
# under the display. keyd would grab it and the g510 agent would stop seeing
# any of them, with nothing anywhere to say why.
#
# 046d:c22d:0b724a72 is the main keyboard node and nothing else.
[ids]
046d:c22d:0b724a72

include layouts/de

[global]
default_layout = de
